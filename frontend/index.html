<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YojanaGPT — सरकारी योजनाएं, आपकी भाषा में</title>
  <link href="https://fonts.googleapis.com/css2?family=Tiro+Devanagari+Hindi:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --saffron: #FF6B00;
      --saffron-light: #FF8C3A;
      --saffron-glow: rgba(255, 107, 0, 0.15);
      --green: #138808;
      --green-light: #1aad09;
      --navy: #000080;
      --bg: #0A0A0F;
      --bg-card: #13131A;
      --bg-input: #1C1C26;
      --border: rgba(255,255,255,0.08);
      --border-accent: rgba(255, 107, 0, 0.3);
      --text: #F0F0F0;
      --text-dim: #888;
      --text-dimmer: #555;
      --user-bubble: #FF6B00;
      --bot-bubble: #1C1C26;
      --radius: 18px;
      --radius-sm: 10px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Animated background ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 60% 40% at 10% 0%, rgba(255,107,0,0.07) 0%, transparent 60%),
        radial-gradient(ellipse 40% 30% at 90% 100%, rgba(19,136,8,0.05) 0%, transparent 60%),
        radial-gradient(ellipse 50% 50% at 50% 50%, rgba(0,0,128,0.04) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    /* ── Header ── */
    header {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      background: rgba(10,10,15,0.9);
      backdrop-filter: blur(20px);
      flex-shrink: 0;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-icon {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, var(--saffron), #FF8C3A);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      box-shadow: 0 0 20px rgba(255,107,0,0.4);
      flex-shrink: 0;
    }

    .logo-text h1 {
      font-size: 17px;
      font-weight: 600;
      color: #fff;
      letter-spacing: -0.3px;
      line-height: 1.1;
    }

    .logo-text p {
      font-size: 11px;
      color: var(--text-dim);
      font-weight: 300;
    }

    .tricolor-bar {
      width: 3px;
      height: 32px;
      border-radius: 3px;
      background: linear-gradient(to bottom, #FF6B00 33%, #fff 33%, #fff 66%, #138808 66%);
      flex-shrink: 0;
    }

    /* ── Language selector ── */
    .lang-select {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .lang-select label {
      font-size: 12px;
      color: var(--text-dim);
    }

    select {
      background: var(--bg-input);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 13px;
      font-family: inherit;
      cursor: pointer;
      outline: none;
      transition: border-color 0.2s;
    }

    select:focus {
      border-color: var(--saffron);
    }

    /* ── Status bar ── */
    .status-bar {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 20px;
      background: rgba(19,136,8,0.08);
      border-bottom: 1px solid rgba(19,136,8,0.15);
      flex-shrink: 0;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--green-light);
      box-shadow: 0 0 8px var(--green-light);
      animation: pulse 2s infinite;
    }

    .status-dot.offline {
      background: #ff4444;
      box-shadow: 0 0 8px #ff4444;
      animation: none;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .status-text {
      font-size: 11px;
      color: var(--text-dim);
    }

    .status-count {
      margin-left: auto;
      font-size: 11px;
      color: var(--text-dimmer);
    }

    /* ── Chat area ── */
    #chat {
      position: relative;
      z-index: 1;
      flex: 1;
      overflow-y: auto;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scroll-behavior: smooth;
    }

    #chat::-webkit-scrollbar { width: 4px; }
    #chat::-webkit-scrollbar-track { background: transparent; }
    #chat::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    /* ── Welcome screen ── */
    .welcome {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      gap: 24px;
      padding: 20px;
      text-align: center;
      animation: fadeIn 0.6s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .welcome-icon {
      font-size: 48px;
      filter: drop-shadow(0 0 20px rgba(255,107,0,0.5));
    }

    .welcome h2 {
      font-family: 'Tiro Devanagari Hindi', serif;
      font-size: 22px;
      color: #fff;
      line-height: 1.4;
    }

    .welcome p {
      font-size: 14px;
      color: var(--text-dim);
      max-width: 320px;
      line-height: 1.6;
    }

    .suggestions {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 100%;
      max-width: 400px;
    }

    .suggestion-btn {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-family: inherit;
      cursor: pointer;
      text-align: left;
      transition: all 0.2s;
      line-height: 1.4;
    }

    .suggestion-btn:hover {
      border-color: var(--saffron);
      background: var(--saffron-glow);
      color: #fff;
    }

    /* ── Messages ── */
    .message {
      display: flex;
      flex-direction: column;
      gap: 6px;
      animation: slideIn 0.3s ease;
      max-width: 88%;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message.user {
      align-self: flex-end;
      align-items: flex-end;
    }

    .message.bot {
      align-self: flex-start;
      align-items: flex-start;
    }

    .bubble {
      padding: 12px 16px;
      border-radius: var(--radius);
      font-size: 14px;
      line-height: 1.6;
    }

    .message.user .bubble {
      background: var(--saffron);
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    .message.bot .bubble {
      background: var(--bot-bubble);
      border: 1px solid var(--border);
      color: var(--text);
      border-bottom-left-radius: 4px;
    }

    .message-meta {
      font-size: 11px;
      color: var(--text-dimmer);
      padding: 0 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .lang-badge {
      background: rgba(255,107,0,0.15);
      color: var(--saffron);
      padding: 1px 6px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 500;
    }

    /* ── Sources ── */
    .sources {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 4px;
    }

    .sources-label {
      font-size: 11px;
      color: var(--text-dimmer);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .source-card {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(255,107,0,0.06);
      border: 1px solid var(--border-accent);
      border-radius: var(--radius-sm);
      padding: 8px 12px;
      text-decoration: none;
      color: var(--text);
      transition: all 0.2s;
    }

    .source-card:hover {
      background: rgba(255,107,0,0.12);
      border-color: var(--saffron);
    }

    .source-icon {
      font-size: 16px;
      flex-shrink: 0;
    }

    .source-info {
      flex: 1;
      min-width: 0;
    }

    .source-name {
      font-size: 12px;
      font-weight: 500;
      color: var(--saffron-light);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .source-url {
      font-size: 10px;
      color: var(--text-dimmer);
    }

    .source-arrow {
      font-size: 12px;
      color: var(--text-dimmer);
      flex-shrink: 0;
    }

    /* ── Typing indicator ── */
    .typing {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 14px 16px;
      background: var(--bot-bubble);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      border-bottom-left-radius: 4px;
      width: fit-content;
    }

    .typing span {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--text-dim);
      animation: bounce 1.2s infinite;
    }

    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
      30% { transform: translateY(-6px); opacity: 1; }
    }

    /* ── Error message ── */
    .error-bubble {
      background: rgba(255,68,68,0.1);
      border: 1px solid rgba(255,68,68,0.3);
      color: #ff9999;
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      font-size: 13px;
    }

    /* ── Input area ── */
    .input-area {
      position: relative;
      z-index: 10;
      padding: 12px 16px 16px;
      border-top: 1px solid var(--border);
      background: rgba(10,10,15,0.95);
      backdrop-filter: blur(20px);
      flex-shrink: 0;
    }

    .input-row {
      display: flex;
      gap: 10px;
      align-items: flex-end;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 14px;
      transition: border-color 0.2s;
    }

    .input-row:focus-within {
      border-color: var(--saffron);
      box-shadow: 0 0 0 3px rgba(255,107,0,0.08);
    }

    textarea {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-size: 15px;
      font-family: inherit;
      resize: none;
      line-height: 1.5;
      max-height: 120px;
      min-height: 24px;
    }

    textarea::placeholder { color: var(--text-dimmer); }

    .send-btn {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: var(--saffron);
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.2s;
      color: white;
    }

    .send-btn:hover:not(:disabled) {
      background: var(--saffron-light);
      transform: scale(1.05);
    }

    .send-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none;
    }

    .input-hint {
      font-size: 11px;
      color: var(--text-dimmer);
      text-align: center;
      margin-top: 8px;
    }

    /* ── Responsive ── */
    @media (max-width: 480px) {
      header { padding: 12px 14px; }
      .logo-text p { display: none; }
      #chat { padding: 14px 12px; }
      .message { max-width: 95%; }
      .input-area { padding: 10px 12px 14px; }
    }
  </style>
</head>
<body>

<!-- Header -->
<header>
  <div class="logo">
    <div class="logo-icon">🏛️</div>
    <div class="logo-text">
      <h1>YojanaGPT</h1>
      <p>सरकारी योजनाएं · आपकी भाषा में</p>
    </div>
  </div>
  <div class="tricolor-bar"></div>
  <div class="lang-select">
    <label>भाषा</label>
    <select id="langSelect">
      <option value="">Auto detect</option>
      <option value="hi">हिंदी</option>
      <option value="ta">தமிழ்</option>
      <option value="te">తెలుగు</option>
      <option value="bn">বাংলা</option>
      <option value="mr">मराठी</option>
      <option value="gu">ગુજરાતી</option>
      <option value="kn">ಕನ್ನಡ</option>
      <option value="ml">മലയാളം</option>
      <option value="pa">ਪੰਜਾਬੀ</option>
      <option value="en">English</option>
    </select>
  </div>
</header>

<!-- Status bar -->
<div class="status-bar">
  <div class="status-dot" id="statusDot"></div>
  <span class="status-text" id="statusText">Connecting to YojanaGPT...</span>
  <span class="status-count" id="statusCount"></span>
</div>

<!-- Chat area -->
<div id="chat">
  <div class="welcome" id="welcome">
    <div class="welcome-icon">🇮🇳</div>
    <h2>नमस्ते! मैं YojanaGPT हूं</h2>
    <p>Ask me about any Indian government scheme in your language. I'll answer in the same language.</p>
    <div class="suggestions">
      <button class="suggestion-btn" onclick="sendSuggestion(this.textContent)">
        PM Kisan ke liye kaun eligible hai?
      </button>
      <button class="suggestion-btn" onclick="sendSuggestion(this.textContent)">
        What documents are needed for NOS-SWD scholarship?
      </button>
      <button class="suggestion-btn" onclick="sendSuggestion(this.textContent)">
        Divyang students ke liye koi scholarship hai?
      </button>
      <button class="suggestion-btn" onclick="sendSuggestion(this.textContent)">
        PM கிசான் திட்டத்திற்கு யார் தகுதியானவர்கள்?
      </button>
    </div>
  </div>
</div>

<!-- Input -->
<div class="input-area">
  <div class="input-row">
    <textarea
      id="input"
      placeholder="अपना सवाल यहाँ लिखें... / Ask your question..."
      rows="1"
      onkeydown="handleKey(event)"
      oninput="autoResize(this)"
    ></textarea>
    <button class="send-btn" id="sendBtn" onclick="sendMessage()" title="Send">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="22" y1="2" x2="11" y2="13"></line>
        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
      </svg>
    </button>
  </div>
  <p class="input-hint">Press Enter to send · Shift+Enter for new line · 4,600+ schemes available</p>
</div>

<script>
  const API = 'http://localhost:8000';
  let isLoading = false;

  // ── Health check on load ──
  async function checkHealth() {
    try {
      const res = await fetch(`${API}/health`);
      const data = await res.json();
      document.getElementById('statusDot').classList.remove('offline');
      document.getElementById('statusText').textContent = 'YojanaGPT is ready';
      document.getElementById('statusCount').textContent = `${data.chunks_in_db.toLocaleString()} scheme chunks loaded`;
    } catch {
      document.getElementById('statusDot').classList.add('offline');
      document.getElementById('statusText').textContent = 'API offline — start uvicorn on port 8000';
      document.getElementById('statusCount').textContent = '';
    }
  }

  checkHealth();

  // ── Auto resize textarea ──
  function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 120) + 'px';
  }

  // ── Handle Enter key ──
  function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  }

  // ── Suggestion buttons ──
  function sendSuggestion(text) {
    document.getElementById('input').value = text;
    sendMessage();
  }

  // ── Send message ──
  async function sendMessage() {
    const input = document.getElementById('input');
    const question = input.value.trim();
    if (!question || isLoading) return;

    // Hide welcome screen
    const welcome = document.getElementById('welcome');
    if (welcome) welcome.remove();

    // Add user message
    addMessage('user', question);
    input.value = '';
    input.style.height = 'auto';

    // Show typing indicator
    const typingId = addTyping();
    setLoading(true);

    try {
      const res = await fetch(`${API}/ask`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question, top_k: 5 })
      });

      if (!res.ok) throw new Error(`API error: ${res.status}`);
      const data = await res.json();

      removeTyping(typingId);
      addBotMessage(data);

    } catch (err) {
      removeTyping(typingId);
      addError('Could not reach YojanaGPT API. Make sure uvicorn is running on port 8000.');
    } finally {
      setLoading(false);
    }
  }

  // ── Add user message ──
  function addMessage(role, text) {
    const chat = document.getElementById('chat');
    const div = document.createElement('div');
    div.className = `message ${role}`;
    div.innerHTML = `
      <div class="bubble">${escapeHtml(text)}</div>
      <div class="message-meta">${formatTime()}</div>
    `;
    chat.appendChild(div);
    scrollToBottom();
    return div;
  }

  // ── Add bot message with sources ──
  function addBotMessage(data) {
    const chat = document.getElementById('chat');
    const div = document.createElement('div');
    div.className = 'message bot';

    const langBadge = data.detected_language !== 'en'
      ? `<span class="lang-badge">${data.language_name}</span>`
      : '';

    let sourcesHtml = '';
    if (data.sources && data.sources.length > 0) {
      const cards = data.sources.map(s => `
        <a class="source-card" href="${s.source_url}" target="_blank" rel="noopener">
          <span class="source-icon">📋</span>
          <div class="source-info">
            <div class="source-name">${escapeHtml(s.scheme_name)}</div>
            <div class="source-url">myscheme.gov.in</div>
          </div>
          <span class="source-arrow">↗</span>
        </a>
      `).join('');

      sourcesHtml = `
        <div class="sources">
          <div class="sources-label">Sources</div>
          ${cards}
        </div>
      `;
    }

    div.innerHTML = `
      <div class="bubble">${formatAnswer(data.answer)}</div>
      <div class="message-meta">${formatTime()} ${langBadge}</div>
      ${sourcesHtml}
    `;

    chat.appendChild(div);
    scrollToBottom();
  }

  // ── Add error ──
  function addError(msg) {
    const chat = document.getElementById('chat');
    const div = document.createElement('div');
    div.className = 'message bot';
    div.innerHTML = `<div class="error-bubble">⚠️ ${escapeHtml(msg)}</div>`;
    chat.appendChild(div);
    scrollToBottom();
  }

  // ── Typing indicator ──
  function addTyping() {
    const chat = document.getElementById('chat');
    const id = 'typing-' + Date.now();
    const div = document.createElement('div');
    div.className = 'message bot';
    div.id = id;
    div.innerHTML = `
      <div class="typing">
        <span></span><span></span><span></span>
      </div>
    `;
    chat.appendChild(div);
    scrollToBottom();
    return id;
  }

  function removeTyping(id) {
    const el = document.getElementById(id);
    if (el) el.remove();
  }

  // ── Helpers ──
  function setLoading(val) {
    isLoading = val;
    document.getElementById('sendBtn').disabled = val;
    document.getElementById('input').disabled = val;
  }

  function scrollToBottom() {
    const chat = document.getElementById('chat');
    chat.scrollTop = chat.scrollHeight;
  }

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function formatAnswer(text) {
    // Convert markdown-style bullets to HTML
    return escapeHtml(text)
      .replace(/\n/g, '<br>')
      .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
      .replace(/•\s/g, '• ');
  }

  function formatTime() {
    return new Date().toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' });
  }
</script>
</body>
</html>
