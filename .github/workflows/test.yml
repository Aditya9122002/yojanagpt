# .github/workflows/test.yml
# Runs automatically on every push and pull request to main branch.
# This ensures code quality is maintained throughout development.

name: YojanaGPT CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # Step 1 — Check out the code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2 — Set up Python 3.11
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # Step 3 — Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      # Step 4 — Run tests with coverage
      - name: Run tests
        run: |
          pytest tests/ -v --cov=src --cov-report=term-missing

      # Step 5 — Print coverage summary
      - name: Coverage summary
        run: |
          pytest tests/ --cov=src --cov-report=term-missing --tb=no -q